<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="28" fill="#0d1117"/><g font-family="Inter,Arial" text-anchor="middle"><text x="600" y="58" fill="#e6edf3" font-size="28" font-weight="700">MCP: A Clear Interface Between AI and Systems</text><rect x="70" y="165" width="220" height="120" rx="20" fill="#111827" stroke="#334155"/><text x="180" y="212" fill="#e6edf3" font-size="21" font-weight="700">AI Host</text><text x="180" y="245" fill="#9aa4b2" font-size="16">Claude / IDE / App</text><rect x="400" y="135" width="400" height="180" rx="24" fill="#13231b" stroke="#2ecc71" stroke-width="2"/><text x="600" y="180" fill="#e6edf3" font-size="23" font-weight="700">MCP Server</text><text x="600" y="220" fill="#9aa4b2" font-size="17">Tools • Resources • Prompts</text><text x="600" y="253" fill="#9aa4b2" font-size="15">Clear contracts • Permissions • Audit</text><rect x="910" y="165" width="220" height="120" rx="20" fill="#111827" stroke="#334155"/><text x="1020" y="212" fill="#e6edf3" font-size="21" font-weight="700">Business Systems</text><text x="1020" y="245" fill="#9aa4b2" font-size="16">APIs / DB / Files / SaaS</text><g stroke="#2ecc71" stroke-width="3" fill="none"><path d="M290 225h110"/><path d="M800 225h110"/></g><text x="600" y="390" fill="#e6edf3" font-size="19" font-weight="600">Expose capabilities through focused, permission-aware interfaces.</text><text x="600" y="428" fill="#9aa4b2" font-size="17">Keep business rules and authorization in the systems that own them.</text></g></svg>