<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520"><rect width="1200" height="520" rx="28" fill="#0d1117"/><g font-family="Inter,Arial" text-anchor="middle"><text x="600" y="58" fill="#e6edf3" font-size="28" font-weight="700">From Business Problem to Production System</text><g font-size="18" font-weight="600"><rect x="55" y="170" width="190" height="110" rx="18" fill="#111827" stroke="#2ecc71"/><text x="150" y="215" fill="#e6edf3">Business</text><text x="150" y="245" fill="#9aa4b2">Problem</text><rect x="300" y="170" width="190" height="110" rx="18" fill="#111827" stroke="#2ecc71"/><text x="395" y="215" fill="#e6edf3">Domain</text><text x="395" y="245" fill="#9aa4b2">Boundaries</text><rect x="545" y="170" width="190" height="110" rx="18" fill="#111827" stroke="#2ecc71"/><text x="640" y="215" fill="#e6edf3">APIs &amp;</text><text x="640" y="245" fill="#9aa4b2">Orchestration</text><rect x="790" y="170" width="150" height="110" rx="18" fill="#111827" stroke="#2ecc71"/><text x="865" y="215" fill="#e6edf3">Data</text><text x="865" y="245" fill="#9aa4b2">+ Events</text><rect x="995" y="170" width="150" height="110" rx="18" fill="#111827" stroke="#2ecc71"/><text x="1070" y="215" fill="#e6edf3">Delivery</text><text x="1070" y="245" fill="#9aa4b2">+ Operate</text></g><g stroke="#2ecc71" stroke-width="3" fill="none"><path d="M245 225h55"/><path d="M490 225h55"/><path d="M735 225h55"/><path d="M940 225h55"/></g><text x="600" y="370" fill="#9aa4b2" font-size="19">Architecture is a chain of decisions — not just a diagram.</text><text x="600" y="408" fill="#9aa4b2" font-size="17">Start with the outcome, make boundaries explicit, design failure paths, then build.</text></g></svg>