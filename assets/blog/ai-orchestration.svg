<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560"><rect width="1200" height="560" rx="28" fill="#0d1117"/><g font-family="Inter,Arial" text-anchor="middle"><text x="600" y="58" fill="#e6edf3" font-size="28" font-weight="700">AI Agent Orchestration</text><rect x="470" y="95" width="260" height="90" rx="20" fill="#13231b" stroke="#2ecc71" stroke-width="2"/><text x="600" y="133" fill="#e6edf3" font-size="20" font-weight="700">Agent / Decision Layer</text><text x="600" y="162" fill="#9aa4b2" font-size="15">Reason • Decide • Delegate</text><g font-size="17"><rect x="70" y="250" width="210" height="100" rx="18" fill="#111827" stroke="#334155"/><text x="175" y="290" fill="#e6edf3">Retrieval</text><text x="175" y="318" fill="#9aa4b2">RAG / Vector DB</text><rect x="330" y="250" width="210" height="100" rx="18" fill="#111827" stroke="#334155"/><text x="435" y="290" fill="#e6edf3">Tools</text><text x="435" y="318" fill="#9aa4b2">APIs / MCP</text><rect x="590" y="250" width="210" height="100" rx="18" fill="#111827" stroke="#334155"/><text x="695" y="290" fill="#e6edf3">State</text><text x="695" y="318" fill="#9aa4b2">Workflow / Memory</text><rect x="850" y="250" width="280" height="100" rx="18" fill="#111827" stroke="#334155"/><text x="990" y="290" fill="#e6edf3">Guardrails</text><text x="990" y="318" fill="#9aa4b2">Policy / Approval / Audit</text></g><g stroke="#2ecc71" stroke-width="3" fill="none"><path d="M600 185v40"/><path d="M175 225v25M435 225v25M695 225v25M990 225v25"/></g><text x="600" y="430" fill="#e6edf3" font-size="19" font-weight="600">Production AI = model + tools + state + controls + observability</text><text x="600" y="468" fill="#9aa4b2" font-size="17">The orchestration layer makes the workflow reliable, inspectable, and recoverable.</text></g></svg>